<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Charts Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: white;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 250px;
      background-image: url("https://www.bom.gov.au/themes/custom/bom_theme/bom-react/dist/assets/@ausbom/weather-moods/mostly-clear-night.webp"), linear-gradient(-180deg, rgb(0, 30, 60) 0%, rgb(0, 59, 113) 100%);
      color: white;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .location {
      font-size: 44px;
      font-family: "Inter", "Inter-fallback", sans-serif;
      opacity: 0.9;
      margin-bottom: 10px;
    }

    .current-icon {
      width: 80px;
      height: 80px;
      margin: 20px auto;
      display: block;
    }

    .current-icon img {
      width: 100%;
      height: 100%;
    }

    .current-temp {
      font-size: 4rem;
      font-weight: 300;
      text-align: center;
      line-height: 1;
    }

    .condition {
      font-size: 1.1rem;
      text-align: center;
      opacity: 0.9;
      margin-top: 10px;
    }

    .current-details {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }

    .detail-label {
      opacity: 0.8;
    }

    .detail-value {
      font-weight: 600;
    }

    .main-container {
      margin-left: 250px;
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      height: 100vh;
    }

    .day-chart-container {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #e5e7eb;
    }

    .day-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chart-legend {
      display: flex;
      gap: 20px;
      margin-left: auto;
      font-size: 0.85rem;
      color: #6b7280;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .day-name {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1f2937;
    }

    .day-icon {
      width: 60px;
      height: 60px;
    }

    .day-icon img {
      width: 100%;
      height: 100%;
    }

    .day-max-temp {
      font-size: 1.5rem;
      font-weight: 600;
      color: #3b82f6;
      margin-left: auto;
    }

    .chart-wrapper {
      position: relative;
      height: 300px;
      margin-bottom: 20px;
    }

    .icon-row {
      display: grid;
      grid-template-columns: repeat(24, 1fr);
      gap: 2px;
      margin-top: 10px;
      padding: 0 40px;
    }

    .hour-icon {
      width: 32px;
      height: 32px;
      opacity: 0.9;
      margin: 0 auto;
    }

    .hour-icon img {
      width: 100%;
      height: 100%;
    }

    .loading {
      text-align: center;
      padding: 50px;
      font-size: 1.2rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="location">Hobart</div>
    <div class="current-icon"><img src="https://www.bom.gov.au/themes/custom/bom_theme/bom-react/dist/assets/@ausbom/weather-icons/partly-cloudy.svg" alt="Partly Cloudy"></div>
    <div class="current-temp" id="sidebar-temp">--°</div>
    <div class="condition" id="sidebar-condition">Loading...</div>
    
    <div class="current-details" id="sidebar-details">
      <div class="detail-row">
        <span class="detail-label">Feels Like</span>
        <span class="detail-value">--°</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Today's max</span>
        <span class="detail-value">--°</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Today's rainfall</span>
        <span class="detail-value">0mm</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Wind</span>
        <span class="detail-value">-- kt</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Humidity</span>
        <span class="detail-value">--%</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Dew Point</span>
        <span class="detail-value">--°</span>
      </div>
      <div class="detail-row" style="border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 12px; margin-top: 12px;">
        <span class="detail-label">Overnight min</span>
        <span class="detail-value">--°</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Tomorrow's max</span>
        <span class="detail-value">--°</span>
      </div>
      <div class="detail-row" style="border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 12px; margin-top: 12px;">
        <span class="detail-label">Sunrise</span>
        <span class="detail-value">--</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Sunset</span>
        <span class="detail-value">--</span>
      </div>
      <div class="detail-row" style="border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 12px; margin-top: 12px;">
        <span class="detail-label">Next high tide</span>
        <span class="detail-value" id="next-high-tide">--</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Next low tide</span>
        <span class="detail-value" id="next-low-tide">--</span>
      </div>
    </div>
  </div>

  <div class="main-container">
    <div id="charts-container">
      <div class="loading">Loading weather data...</div>
    </div>
  </div>

<script>
const proxy = "https://corsproxy.io/?url=";

const endpoints = [
  ["Daily Forecast", "https://api.bom.gov.au/apikey/v1/forecasts/daily/593/42?timezone=Australia%2FHobart"],
  ["1-Hourly Forecast", "https://api.bom.gov.au/apikey/v1/forecasts/1hourly/593/42?timezone=Australia%2FHobart"],
  ["Latest Observation", "https://api.bom.gov.au/apikey/v1/observations/latest/94029/atm/surf_air?include_qc_results=false"],
  ["Astro", "https://api.bom.gov.au/apikey/v1/forecasts/astro/147.327/-42.889"]
];

const iconMap = {
  1: 'sunny',
  2: null,
  3: 'mostly-sunny',
  4: 'cloudy',
  6: null,
  8: null,
  9: null,
  10: null,
  11: 'showers',
  12: null,
  13: null,
  14: null,
  15: null,
  16: null,
  17: null,
  18: null
};

function getBomIconUrl(iconCode, isNight = false) {
  const baseUrl = 'https://www.bom.gov.au/themes/custom/bom_theme/bom-react/dist/assets/@ausbom/weather-icons/';
  let iconName = iconMap[iconCode];
  
  if (!iconName) return null;
  
  if (isNight) {
    if (iconCode === 1) iconName = 'clear-night';
    else if (iconCode === 2) iconName = 'mostly-clear-night';
    else if (iconCode === 3) iconName = 'mostly-clear-night';
  }
  
  return `${baseUrl}${iconName}.svg`;
}

function renderCurrentObs(data, todayIconCode, astroData, dailyData) {
  const temp = data.temp?.dry_bulb_1min_cel;
  const feelsLike = data.temp?.apparent_1min_cel;
  const humidity = data.temp?.rel_hum_percent;
  const dewPoint = data.temp?.dew_pnt_1min_cel;
  const windSpeed = data.wind?.speed_10m_mps ? (data.wind.speed_10m_mps * 1.94384).toFixed(1) : '--';
  const windDir = data.wind?.dirn_10m_ord || '';
  
  const todayMax = dailyData?.[0]?.atm?.surf_air?.temp_max_cel;
  const overnightMin = dailyData?.[1]?.atm?.surf_air?.temp_min_cel;
  const tomorrowMax = dailyData?.[1]?.atm?.surf_air?.temp_max_cel;
  const todayRainfall = dailyData?.[0]?.atm?.surf_air?.precip?.total_mm;
  
  let isNight = false;
  let sunriseTime = '';
  let sunsetTime = '';
  if (astroData && astroData.length > 0) {
    const now = new Date();
    const todayAstro = astroData[0];
    if (todayAstro.astro?.sunrise_utc && todayAstro.astro?.sunset_utc) {
      const sunrise = new Date(todayAstro.astro.sunrise_utc);
      const sunset = new Date(todayAstro.astro.sunset_utc);
      isNight = now < sunrise || now > sunset;
      sunriseTime = sunrise.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
      sunsetTime = sunset.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    }
  }
  
  const iconUrl = getBomIconUrl(todayIconCode || 4, isNight);
  if (iconUrl) {
    document.querySelector('.current-icon img').src = iconUrl;
  }
  
  document.getElementById('sidebar-temp').textContent = `${temp?.toFixed(1) || '--'}°`;
  document.getElementById('sidebar-condition').textContent = 'Current Conditions';
  
  document.getElementById('sidebar-details').innerHTML = `
    <div class="detail-row">
      <span class="detail-label">Feels Like</span>
      <span class="detail-value">${feelsLike?.toFixed(1) || '--'}°</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Today's max</span>
      <span class="detail-value">${todayMax?.toFixed(0) || '--'}°</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Today's rainfall</span>
      <span class="detail-value">${todayRainfall > 0 ? todayRainfall.toFixed(1) + 'mm' : '0mm'}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Wind</span>
      <span class="detail-value">${windSpeed} kt ${windDir}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Humidity</span>
      <span class="detail-value">${humidity?.toFixed(0) || '--'}%</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Dew Point</span>
      <span class="detail-value">${dewPoint?.toFixed(1) || '--'}°</span>
    </div>
    <div class="detail-row" style="border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 12px; margin-top: 12px;">
      <span class="detail-label">Overnight min</span>
      <span class="detail-value">${overnightMin?.toFixed(0) || '--'}°</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Tomorrow's max</span>
      <span class="detail-value">${tomorrowMax?.toFixed(0) || '--'}°</span>
    </div>
    <div class="detail-row" style="border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 12px; margin-top: 12px;">
      <span class="detail-label">Sunrise</span>
      <span class="detail-value">${sunriseTime || '--'}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Sunset</span>
      <span class="detail-value">${sunsetTime || '--'}</span>
    </div>
    <div class="detail-row" style="border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 12px; margin-top: 12px;">
      <span class="detail-label">Next high tide</span>
      <span class="detail-value" id="next-high-tide">--</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Next low tide</span>
      <span class="detail-value" id="next-low-tide">--</span>
    </div>
  `;
}

function renderTideInfo(tideData) {
  const now = new Date();
  const dailyForecasts = tideData?.daily || [];
  
  let nextHigh = null;
  let nextLow = null;
  
  for (const day of dailyForecasts) {
    const tides = day.tide || [];
    for (const tide of tides) {
      const tideTime = new Date(tide.datetime_utc);
      if (tideTime > now) {
        if (tide.type === 'high' && !nextHigh) {
          nextHigh = tideTime.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        } else if (tide.type === 'low' && !nextLow) {
          nextLow = tideTime.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }
        if (nextHigh && nextLow) break;
      }
    }
    if (nextHigh && nextLow) break;
  }
  
  if (nextHigh) {
    document.getElementById('next-high-tide').textContent = nextHigh;
  }
  if (nextLow) {
    document.getElementById('next-low-tide').textContent = nextLow;
  }
}

function renderCharts(hourlyData, dailyData, astroData) {
  const container = document.getElementById('charts-container');
  container.innerHTML = '';
  
  // Build astro map
  const astroMap = {};
  if (astroData) {
    astroData.forEach(day => {
      const sunrise = new Date(day.astro.sunrise_utc);
      const sunset = new Date(day.astro.sunset_utc);
      const dateKey = sunrise.toLocaleDateString('en-CA');
      astroMap[dateKey] = { sunrise, sunset };
    });
  }
  
  // Get daily data
  const dayData = dailyData.slice(0, 7).map((day, idx) => {
    return {
      iconCode: day.atm?.surf_air?.weather?.icon_code || 4,
      maxTemp: day.atm?.surf_air?.temp_max_cel,
      date: new Date(day.date_utc)
    };
  });
  
  // Process each day
  for (let dayIdx = 0; dayIdx < Math.min(hourlyData.length, 7); dayIdx++) {
    const hourlyArray = hourlyData[dayIdx]['1hourly'] || [];
    
    if (hourlyArray.length === 0) continue;
    
    const dayDate = new Date(hourlyArray[0].time_utc);
    const dayName = dayIdx === 0 ? 'Today' : dayIdx === 1 ? 'Tomorrow' : 
                    dayDate.toLocaleDateString('en-AU', { weekday: 'long', timeZone: 'Australia/Hobart' });
    
    const dayIconCode = dayData[dayIdx]?.iconCode || 4;
    const dayMaxTemp = dayData[dayIdx]?.maxTemp;
    const dayIconUrl = getBomIconUrl(dayIconCode, false);
    
    // Filter hours for this day
    const now = new Date();
    const hours = hourlyArray
      .map(h => ({ ...h, date: new Date(h.time_utc) }))
      .filter(h => dayIdx === 0 ? h.date >= now : true);
    
    if (hours.length === 0) continue;
    
    // Create full 24-hour labels
    const allLabels = [];
    for (let h = 0; h < 24; h++) {
      const hour12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
      const ampm = h < 12 ? 'AM' : 'PM';
      allLabels.push(`${hour12} ${ampm}`);
    }
    
    // Create temperature and rainfall arrays with nulls for missing hours
    const allTemps = new Array(24).fill(null);
    const allFeelsLike = new Array(24).fill(null);
    const allRainfall = new Array(24).fill(null);
    hours.forEach(h => {
      const localHour = new Date(h.date.toLocaleString('en-US', { timeZone: 'Australia/Hobart' })).getHours();
      allTemps[localHour] = h.atm?.surf_air?.temp_cel || null;
      allFeelsLike[localHour] = h.atm?.surf_air?.temp_apparent_cel || null;
      allRainfall[localHour] = h.atm?.surf_air?.precip?.total_mm || 0;
    });
    
    // Determine night/day for all 24 hours
    const isNightArray = new Array(24).fill(false);
    const iconUrls = new Array(24).fill(null);
    
    // Use existing dayDate to determine astro data
    const dateKey = dayDate.toLocaleDateString('en-CA');
    const astro = astroMap[dateKey];
    
    for (let h = 0; h < 24; h++) {
      // Create a date for this hour
      const hourDate = new Date(dayDate);
      hourDate.setHours(h, 0, 0, 0);
      
      // Determine if night
      if (astro) {
        isNightArray[h] = hourDate < astro.sunrise || hourDate > astro.sunset;
      }
      
      // Get icon only if we have data for this hour
      if (allTemps[h] !== null) {
        iconUrls[h] = getBomIconUrl(dayIconCode, isNightArray[h]);
      }
    }
    
    // Background colors based on night/day
    const backgroundColors = isNightArray.map(isNight => 
      isNight ? 'rgba(156, 163, 175, 0.3)' : 'rgba(59, 130, 246, 0.2)'
    );
    
    const borderColors = isNightArray.map(isNight => 
      isNight ? 'rgba(107, 114, 128, 0.8)' : 'rgba(59, 130, 246, 1)'
    );
    
    // Create chart container
    const chartDiv = document.createElement('div');
    chartDiv.className = 'day-chart-container';
    chartDiv.innerHTML = `
      <div class="day-header">
        <div class="day-name">${dayName}</div>
        <div class="day-header-right">
          ${dayIconUrl ? `<img src="${dayIconUrl}" alt="Weather" style="width: 40px; height: 40px;">` : ''}
          <div class="day-temp">${dayMaxTemp !== undefined ? dayMaxTemp.toFixed(0) + '\u00b0' : '--'}</div>
        </div>
      </div>
      <div class="chart-wrapper">
        <canvas id="chart-${dayIdx}"></canvas>
      </div>
      <div class="icon-row" id="icons-${dayIdx}"></div>
    `;
    
    document.getElementById('charts-container').appendChild(chartDiv);
    
    // Build annotations for sunrise, sunset, and tides (reuse dateKey from above)
    const annotations = {};
    
    // Collect all event times to check for overlaps
    const eventTimes = [];
    
    let sunriseTime = null;
    let sunsetTime = null;
    
    if (astro) {
      const sunriseLocal = new Date(astro.sunrise.toLocaleString('en-US', { timeZone: 'Australia/Hobart' }));
      const sunsetLocal = new Date(astro.sunset.toLocaleString('en-US', { timeZone: 'Australia/Hobart' }));
      sunriseTime = sunriseLocal.getHours() + sunriseLocal.getMinutes() / 60;
      sunsetTime = sunsetLocal.getHours() + sunsetLocal.getMinutes() / 60;
      
      eventTimes.push({ time: sunriseTime, type: 'sunrise' });
      eventTimes.push({ time: sunsetTime, type: 'sunset' });
    }
    
    // Collect tide times
    const tideTimes = [];
    if (window.tideData && window.tideData.daily) {
      const dayTideData = window.tideData.daily.find(d => {
        const tideDate = new Date(d.date_utc);
        return tideDate.toLocaleDateString('en-CA') === dateKey;
      });
      
      if (dayTideData && dayTideData.tide) {
        dayTideData.tide.forEach((tide, idx) => {
          const tideTime = new Date(tide.datetime_utc);
          const tideLocal = new Date(tideTime.toLocaleString('en-US', { timeZone: 'Australia/Hobart' }));
          const tideExactTime = tideLocal.getHours() + tideLocal.getMinutes() / 60;
          tideTimes.push({ time: tideExactTime, type: tide.type, idx: idx });
          eventTimes.push({ time: tideExactTime, type: 'tide' });
        });
      }
    }
    
    // Sort events by time
    eventTimes.sort((a, b) => a.time - b.time);
    
    // Function to check if two times overlap (within 0.5 hours = 30 minutes)
    const checkOverlap = (time1, time2) => Math.abs(time1 - time2) < 0.5;
    
    // Assign vertical offsets to avoid overlaps
    const assignedOffsets = {};
    
    eventTimes.forEach((event, idx) => {
      const timeKey = event.time.toFixed(4); // Round to 4 decimal places for consistent keys
      
      if (idx === 0) {
        assignedOffsets[`${event.type}_${timeKey}`] = 10;
      } else {
        const prevEvent = eventTimes[idx - 1];
        const prevTimeKey = prevEvent.time.toFixed(4);
        const prevOffset = assignedOffsets[`${prevEvent.type}_${prevTimeKey}`];
        
        if (checkOverlap(event.time, prevEvent.time)) {
          // Stack 30px below previous event
          assignedOffsets[`${event.type}_${timeKey}`] = prevOffset + 30;
        } else {
          // Reset to top
          assignedOffsets[`${event.type}_${timeKey}`] = 10;
        }
      }
    });
    // Create sunrise annotation
    if (sunriseTime !== null) {
      annotations.sunrise = {
        type: 'line',
        xMin: sunriseTime,
        xMax: sunriseTime,
        borderColor: 'rgba(251, 191, 36, 0.8)',
        borderWidth: 2,
        borderDash: [5, 5],
        label: {
          display: true,
          content: 'Sunrise',
          position: 'end',
          yAdjust: assignedOffsets[`sunrise_${sunriseTime.toFixed(4)}`] || 10,
          yAdjust: assignedOffsets[`sunrise_${sunriseTime}`] || 10,
          backgroundColor: 'rgba(255, 255, 255, 0.9)',
          color: 'rgba(146, 64, 14, 1)',
          padding: 4,
          borderRadius: 4,
          font: { size: 12, weight: 'bold' }
        }
      };
    }
    
    // Create sunset annotation
    if (sunsetTime !== null) {
      annotations.sunset = {
        type: 'line',
        xMin: sunsetTime,
        xMax: sunsetTime,
        borderColor: 'rgba(249, 115, 22, 0.8)',
        borderWidth: 2,
        borderDash: [5, 5],
        label: {
          display: true,
          content: 'Sunset',
          position: 'end',
          yAdjust: assignedOffsets[`sunset_${sunsetTime.toFixed(4)}`] || 10,
          backgroundColor: 'rgba(255, 255, 255, 0.9)',
          color: 'rgba(154, 52, 18, 1)',
          padding: 4,
          borderRadius: 4,
          font: { size: 12, weight: 'bold' }
        }
      };
    }
    
    // Create tide annotations
    tideTimes.forEach((tideInfo) => {
      annotations[`tide${tideInfo.idx}`] = {
        type: 'line',
        xMin: tideInfo.time,
        xMax: tideInfo.time,
        borderColor: tideInfo.type === 'high' ? 'rgba(59, 130, 246, 0.6)' : 'rgba(147, 197, 253, 0.6)',
        borderWidth: 2,
        borderDash: [3, 3],
        label: {
          display: true,
          content: tideInfo.type === 'high' ? 'High Tide' : 'Low Tide',
          position: 'end',
          yAdjust: assignedOffsets[`tide_${tideInfo.time.toFixed(4)}`] || 10,
          backgroundColor: 'rgba(255, 255, 255, 0.9)',
          color: tideInfo.type === 'high' ? 'rgba(29, 78, 216, 1)' : 'rgba(37, 99, 235, 1)',
          padding: 4,
          borderRadius: 4,
          font: { size: 12, weight: 'bold' }
        }
      };
    });
    
    // Create chart
    const ctx = document.getElementById(`chart-${dayIdx}`).getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: allLabels,
        datasets: [{
          label: 'Temperature (°C)',
          data: allTemps,
          spanGaps: false,
          backgroundColor: backgroundColors,
          borderColor: borderColors,
          borderWidth: 3,
          fill: true,
          tension: 0.4,
          pointRadius: 6,
          pointHoverRadius: 8,
          pointBackgroundColor: borderColors,
          pointBorderColor: '#fff',
          pointBorderWidth: 2,
          yAxisID: 'y',
          order: 0
        },
        {
          label: 'Feels Like (°C)',
          data: allFeelsLike,
          spanGaps: false,
          backgroundColor: 'transparent',
          borderColor: 'rgba(251, 146, 60, 0.8)',
          borderWidth: 2,
          borderDash: [5, 5],
          fill: false,
          tension: 0.4,
          pointRadius: 3,
          pointHoverRadius: 6,
          pointBackgroundColor: 'rgba(251, 146, 60, 0.8)',
          pointBorderColor: '#fff',
          pointBorderWidth: 1,
          yAxisID: 'y',
          order: 0
        },
        {
          label: 'Rainfall (mm)',
          data: allRainfall,
          type: 'bar',
          backgroundColor: 'rgba(59, 130, 246, 0.5)',
          borderColor: 'rgba(59, 130, 246, 0.8)',
          borderWidth: 1,
          yAxisID: 'y1',
          order: 1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: false
          },
          annotation: {
            annotations: annotations
          },
          tooltip: {
            backgroundColor: 'rgba(0, 0, 0, 0.8)',
            padding: 12,
            titleFont: { size: 14 },
            bodyFont: { size: 16, weight: 'bold' },
            callbacks: {
              label: function(context) {
                if (context.dataset.label === 'Temperature (°C)') {
                  return 'Temp: ' + context.parsed.y + '°C';
                } else if (context.dataset.label === 'Feels Like (°C)') {
                  return 'Feels Like: ' + context.parsed.y + '°C';
                } else {
                  return 'Rain: ' + context.parsed.y + 'mm';
                }
              }
            }
          }
        },
        scales: {
          y: {
            beginAtZero: false,
            position: 'left',
            grid: {
              color: 'rgba(0, 0, 0, 0.1)'
            },
            ticks: {
              font: { size: 12 },
              callback: function(value) {
                return value + '°';
              }
            },
            title: {
              display: true,
              text: 'Temperature (°C)',
              font: { size: 12, weight: 'bold' }
            }
          },
          y1: {
            beginAtZero: true,
            position: 'right',
            grid: {
              drawOnChartArea: false
            },
            ticks: {
              font: { size: 12 },
              callback: function(value) {
                return value + 'mm';
              }
            },
            title: {
              display: true,
              text: 'Rainfall (mm)',
              font: { size: 12, weight: 'bold' },
              color: 'rgba(59, 130, 246, 1)'
            }
          },
          x: {
            grid: {
              display: false
            },
            ticks: {
              font: { size: 11 }
            }
          }
        }
      }
    });
    
    // Add icons below chart for all 24 hours
    const iconRow = document.getElementById(`icons-${dayIdx}`);
    iconUrls.forEach((url, idx) => {
      const iconDiv = document.createElement('div');
      iconDiv.className = 'hour-icon';
      // Only show icon if there's data for this hour
      if (url && allTemps[idx] !== null) {
        iconDiv.innerHTML = `<img src="${url}" alt="Weather">`;
      }
      iconRow.appendChild(iconDiv);
    });
  }
}

async function loadData() {
  try {
    let hourlyData = null;
    let dailyData = null;
    let obsData = null;
    let astroData = null;
    let tideData = null;
    
    for (const [title, url] of endpoints) {
      const r = await fetch(proxy + encodeURIComponent(url));
      const j = await r.json();
      const data = j.data ?? j;
      
      if (title === "1-Hourly Forecast") {
        hourlyData = data.fcst;
      } else if (title === "Daily Forecast") {
        dailyData = data.fcst?.daily;
      } else if (title === "Latest Observation") {
        obsData = data.obs;
      } else if (title === "Astro") {
        astroData = data.fcst?.daily;
      }
    }
    
    try {
      const tideUrl = 'https://api.bom.gov.au/apikey/v1/forecasts/tidal/TAS_TP003';
      const tideResponse = await fetch(proxy + encodeURIComponent(tideUrl));
      const tideJson = await tideResponse.json();
      tideData = tideJson.fcst || tideJson.data?.fcst || tideJson;
      // Store globally for chart rendering
      window.tideData = tideData;
    } catch (e) {
      console.error('Error fetching tide data:', e);
    }
    
    if (obsData && dailyData && astroData) {
      const todayIconCode = dailyData[0]?.atm?.surf_air?.weather?.icon_code;
      renderCurrentObs(obsData, todayIconCode, astroData, dailyData);
    }
    
    if (tideData) {
      renderTideInfo(tideData);
    }
    
    if (hourlyData && dailyData) {
      renderCharts(hourlyData, dailyData, astroData);
    }
    
  } catch (e) {
    console.error('Error loading data:', e);
    document.getElementById('charts-container').innerHTML = '<p style="color: red; padding: 20px;">Error loading weather data</p>';
  }
}

loadData();
</script>
