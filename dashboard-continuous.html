<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continuous Weather Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: white;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 250px;
      background-image: url("https://www.bom.gov.au/themes/custom/bom_theme/bom-react/dist/assets/@ausbom/weather-moods/mostly-clear-night.webp"), linear-gradient(-180deg, rgb(0, 30, 60) 0%, rgb(0, 59, 113) 100%);
      color: white;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .location {
      font-size: 44px;
      font-family: "Inter", "Inter-fallback", sans-serif;
      opacity: 0.9;
      margin-bottom: 10px;
    }

    .current-icon {
      width: 80px;
      height: 80px;
      margin: 20px auto;
      display: block;
    }

    .current-icon img {
      width: 100%;
      height: 100%;
    }

    .current-temp {
      font-size: 4rem;
      font-weight: 300;
      text-align: center;
      line-height: 1;
    }

    .condition {
      font-size: 1.1rem;
      text-align: center;
      opacity: 0.9;
      margin-top: 10px;
    }

    .current-details {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }

    .detail-label {
      opacity: 0.8;
    }

    .detail-value {
      font-weight: 600;
    }

    .main-container {
      margin-left: 250px;
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      height: 100vh;
    }

    .chart-container {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .chart-header {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #e5e7eb;
    }

    .chart-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1f2937;
    }

    .chart-wrapper {
      position: relative;
      height: 400px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .chart-inner {
      position: relative;
      height: 100%;
      min-width: 100%;
      padding: 0 40px;
    }

    .loading {
      text-align: center;
      padding: 50px;
      font-size: 1.2rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="location">Hobart</div>
    <div class="current-icon"><img src="https://www.bom.gov.au/themes/custom/bom_theme/bom-react/dist/assets/@ausbom/weather-icons/partly-cloudy.svg" alt="Partly Cloudy"></div>
    <div class="current-temp" id="sidebar-temp">--°</div>
    <div class="condition" id="sidebar-condition">Loading...</div>
    
    <div class="current-details" id="sidebar-details">
      <div class="detail-row">
        <span class="detail-label">Feels Like</span>
        <span class="detail-value">--°</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Today's max</span>
        <span class="detail-value">--°</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Today's rainfall</span>
        <span class="detail-value">0mm</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Wind</span>
        <span class="detail-value">-- kt</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Humidity</span>
        <span class="detail-value">--%</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Dew Point</span>
        <span class="detail-value">--°</span>
      </div>
      <div class="detail-row" style="border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 12px; margin-top: 12px;">
        <span class="detail-label">Overnight min</span>
        <span class="detail-value">--°</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Tomorrow's max</span>
        <span class="detail-value">--°</span>
      </div>
      <div class="detail-row" style="border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 12px; margin-top: 12px;">
        <span class="detail-label">Sunrise</span>
        <span class="detail-value">--</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Sunset</span>
        <span class="detail-value">--</span>
      </div>
      <div class="detail-row" style="border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 12px; margin-top: 12px;">
        <span class="detail-label">Next high tide</span>
        <span class="detail-value" id="next-high-tide">--</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Next low tide</span>
        <span class="detail-value" id="next-low-tide">--</span>
      </div>
    </div>
  </div>

  <div class="main-container">
    <div class="chart-container">
      <div class="chart-header">
        <div class="chart-title">7-Day Hourly Forecast</div>
      </div>
      <div class="chart-wrapper">
        <div class="chart-inner">
          <canvas id="continuous-chart"></canvas>
        </div>
      </div>

    </div>
  </div>

<script>
const proxy = "https://corsproxy.io/?url=";

const dayIconPlugin = {
  id: 'dayIcons',
  afterDraw(chart, args, options) {
    const { ctx, chartArea, scales } = chart;
    const { bottom } = chartArea;
    const xScale = scales.x;
    
    if (!options.icons || options.icons.length === 0) return;
    
    const iconSize = 28;
    const iconY = bottom + 30; // Position below x-axis labels
    
    options.icons.forEach((iconData, idx) => {
      if (!iconData.image || !iconData.image.complete) return;
      
      const xPos = xScale.getPixelForValue(idx);
      
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.drawImage(
        iconData.image,
        xPos - iconSize / 2,
        iconY,
        iconSize,
        iconSize
      );
      ctx.restore();
    });
  }
};

// Register the plugin
Chart.register(dayIconPlugin);

const endpoints = [
  ["Daily Forecast", "https://api.bom.gov.au/apikey/v1/forecasts/daily/593/42?timezone=Australia%2FHobart"],
  ["1-Hourly Forecast", "https://api.bom.gov.au/apikey/v1/forecasts/1hourly/593/42?timezone=Australia%2FHobart"],
  ["Latest Observation", "https://api.bom.gov.au/apikey/v1/observations/latest/94029/atm/surf_air?include_qc_results=false"],
  ["Astro", "https://api.bom.gov.au/apikey/v1/forecasts/astro/147.327/-42.889"]
];

const iconMap = {
  1: 'sunny',
  2: null,
  3: 'mostly-sunny',
  4: 'cloudy',
  6: null,
  8: null,
  9: null,
  10: null,
  11: 'showers',
  12: null,
  13: null,
  14: null,
  15: null,
  16: null,
  17: null,
  18: null
};

function getBomIconUrl(iconCode, isNight = false) {
  const baseUrl = 'https://www.bom.gov.au/themes/custom/bom_theme/bom-react/dist/assets/@ausbom/weather-icons/';
  let iconName = iconMap[iconCode];
  
  if (!iconName) return null;
  
  if (isNight) {
    if (iconCode === 1) iconName = 'clear-night';
    else if (iconCode === 2) iconName = 'mostly-clear-night';
    else if (iconCode === 3) iconName = 'mostly-clear-night';
  }
  
  return `${baseUrl}${iconName}.svg`;
}

function renderCurrentObs(data, todayIconCode, astroData, dailyData) {
  const temp = data.temp?.dry_bulb_1min_cel;
  const feelsLike = data.temp?.apparent_1min_cel;
  const humidity = data.temp?.rel_hum_percent;
  const dewPoint = data.temp?.dew_pnt_1min_cel;
  const windSpeed = data.wind?.speed_10m_mps ? (data.wind.speed_10m_mps * 1.94384).toFixed(1) : '--';
  const windDir = data.wind?.dirn_10m_ord || '';
  
  const todayMax = dailyData?.[0]?.atm?.surf_air?.temp_max_cel;
  const overnightMin = dailyData?.[1]?.atm?.surf_air?.temp_min_cel;
  const tomorrowMax = dailyData?.[1]?.atm?.surf_air?.temp_max_cel;
  const todayRainfall = dailyData?.[0]?.atm?.surf_air?.precip?.total_mm;
  
  let isNight = false;
  let sunriseTime = '';
  let sunsetTime = '';
  if (astroData && astroData.length > 0) {
    const now = new Date();
    const todayAstro = astroData[0];
    if (todayAstro.astro?.sunrise_utc && todayAstro.astro?.sunset_utc) {
      const sunrise = new Date(todayAstro.astro.sunrise_utc);
      const sunset = new Date(todayAstro.astro.sunset_utc);
      isNight = now < sunrise || now > sunset;
      sunriseTime = sunrise.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
      sunsetTime = sunset.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    }
  }
  
  const iconUrl = getBomIconUrl(todayIconCode || 4, isNight);
  if (iconUrl) {
    document.querySelector('.current-icon img').src = iconUrl;
  }
  
  document.getElementById('sidebar-temp').textContent = `${temp?.toFixed(1) || '--'}°`;
  document.getElementById('sidebar-condition').textContent = 'Current Conditions';
  
  document.getElementById('sidebar-details').innerHTML = `
    <div class="detail-row">
      <span class="detail-label">Feels Like</span>
      <span class="detail-value">${feelsLike?.toFixed(1) || '--'}°</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Today's max</span>
      <span class="detail-value">${todayMax?.toFixed(0) || '--'}°</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Today's rainfall</span>
      <span class="detail-value">${todayRainfall > 0 ? todayRainfall.toFixed(1) + 'mm' : '0mm'}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Wind</span>
      <span class="detail-value">${windSpeed} kt ${windDir}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Humidity</span>
      <span class="detail-value">${humidity?.toFixed(0) || '--'}%</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Dew Point</span>
      <span class="detail-value">${dewPoint?.toFixed(1) || '--'}°</span>
    </div>
    <div class="detail-row" style="border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 12px; margin-top: 12px;">
      <span class="detail-label">Overnight min</span>
      <span class="detail-value">${overnightMin?.toFixed(0) || '--'}°</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Tomorrow's max</span>
      <span class="detail-value">${tomorrowMax?.toFixed(0) || '--'}°</span>
    </div>
    <div class="detail-row" style="border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 12px; margin-top: 12px;">
      <span class="detail-label">Sunrise</span>
      <span class="detail-value">${sunriseTime || '--'}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Sunset</span>
      <span class="detail-value">${sunsetTime || '--'}</span>
    </div>
    <div class="detail-row" style="border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 12px; margin-top: 12px;">
      <span class="detail-label">Next high tide</span>
      <span class="detail-value" id="next-high-tide">--</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Next low tide</span>
      <span class="detail-value" id="next-low-tide">--</span>
    </div>
  `;
}

function renderTideInfo(tideData) {
  const now = new Date();
  const dailyForecasts = tideData?.daily || [];
  
  let nextHigh = null;
  let nextLow = null;
  
  for (const day of dailyForecasts) {
    const tides = day.tide || [];
    for (const tide of tides) {
      const tideTime = new Date(tide.datetime_utc);
      if (tideTime > now) {
        if (tide.type === 'high' && !nextHigh) {
          nextHigh = tideTime.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        } else if (tide.type === 'low' && !nextLow) {
          nextLow = tideTime.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }
        if (nextHigh && nextLow) break;
      }
    }
    if (nextHigh && nextLow) break;
  }
  
  if (nextHigh) {
    document.getElementById('next-high-tide').textContent = nextHigh;
  }
  if (nextLow) {
    document.getElementById('next-low-tide').textContent = nextLow;
  }
}

function renderContinuousChart(hourlyData, dailyData, astroData) {
  // Build astro map
  const astroMap = {};
  if (astroData) {
    astroData.forEach(day => {
      const sunrise = new Date(day.astro.sunrise_utc);
      const sunset = new Date(day.astro.sunset_utc);
      const dateKey = sunrise.toLocaleDateString('en-CA');
      astroMap[dateKey] = { sunrise, sunset };
    });
  }
  
  // Get daily data for icons
  const dayData = dailyData.slice(0, 7).map((day, idx) => {
    return {
      iconCode: day.atm?.surf_air?.weather?.icon_code || 4,
      date: new Date(day.date_utc)
    };
  });
  
  // Collect all hourly data from all days
  let allHours = [];
  const now = new Date();
  
  for (let dayIdx = 0; dayIdx < Math.min(hourlyData.length, 7); dayIdx++) {
    const hourlyArray = hourlyData[dayIdx]['1hourly'] || [];
    hourlyArray.forEach(h => {
      const date = new Date(h.time_utc);
      // Only include hours from now onwards
      if (date >= now) {
        allHours.push({
          ...h,
          date: date,
          dayIdx: dayIdx
        });
      }
    });
  }
  
  // Sort by time
  allHours.sort((a, b) => a.date - b.date);
  
  // Build chart data
  const labels = [];
  const temps = [];
  const feelsLike = [];
  const rainfall = [];
  const backgroundColors = [];
  const borderColors = [];
  const iconUrls = [];
  const dayBoundaries = []; // Track where days change
  
  let currentDay = null;
  
  allHours.forEach((h, idx) => {
    const localDate = new Date(h.date.toLocaleString('en-US', { timeZone: 'Australia/Hobart' }));
    const localHour = localDate.getHours();
    const hour12 = localHour === 0 ? 12 : localHour > 12 ? localHour - 12 : localHour;
    const ampm = localHour < 12 ? 'AM' : 'PM';
    
    labels.push(`${hour12} ${ampm}`);
    temps.push(h.atm?.surf_air?.temp_cel || null);
    feelsLike.push(h.atm?.surf_air?.temp_apparent_cel || null);
    rainfall.push(h.atm?.surf_air?.precip?.total_mm || 0);
    
    // Check for day change
    const dayKey = localDate.toLocaleDateString('en-CA');
    if (currentDay !== dayKey) {
      currentDay = dayKey;
      const dayName = h.dayIdx === 0 ? 'Today' : h.dayIdx === 1 ? 'Tomorrow' : 
                      localDate.toLocaleDateString('en-AU', { weekday: 'long', timeZone: 'Australia/Hobart' });
      dayBoundaries.push({
        index: idx,
        name: dayName,
        date: dayKey
      });
    }
    
    // Determine night/day
    const dateKey = h.date.toLocaleDateString('en-CA');
    const astro = astroMap[dateKey];
    let isNight = false;
    if (astro) {
      isNight = h.date < astro.sunrise || h.date > astro.sunset;
    }
    
    backgroundColors.push(isNight ? 'rgba(156, 163, 175, 0.3)' : 'rgba(59, 130, 246, 0.2)');
    borderColors.push(isNight ? 'rgba(107, 114, 128, 0.8)' : 'rgba(59, 130, 246, 1)');
    
    // Get icon
    const iconCode = dayData[h.dayIdx]?.iconCode || 4;
    const iconUrl = getBomIconUrl(iconCode, isNight);
    iconUrls.push(iconUrl);
  });
  
  // Build annotations for day boundaries, sunrise, sunset, tides
  const annotations = {};
  
  // Day boundary lines
  dayBoundaries.forEach((boundary, idx) => {
    annotations[`day${idx}`] = {
      type: 'line',
      xMin: boundary.index - 0.5,
      xMax: boundary.index - 0.5,
      borderColor: 'rgba(0, 0, 0, 1)',
      borderWidth: 3,
      label: {
        display: true,
        content: boundary.name,
        position: 'end',
        yAdjust: 10,
        backgroundColor: 'rgba(255, 255, 255, 0.95)',
        color: 'rgba(0, 0, 0, 1)',
        padding: 6,
        borderRadius: 4,
        font: { size: 14, weight: 'bold' }
      }
    };
  });
  
  // Add sunrise/sunset/tide annotations
  allHours.forEach((h, idx) => {
    const dateKey = h.date.toLocaleDateString('en-CA');
    const astro = astroMap[dateKey];
    
    if (astro) {
      // Check if this hour matches sunrise
      const sunriseLocal = new Date(astro.sunrise.toLocaleString('en-US', { timeZone: 'Australia/Hobart' }));
      const sunriseHour = sunriseLocal.getHours();
      const localHour = new Date(h.date.toLocaleString('en-US', { timeZone: 'Australia/Hobart' })).getHours();
      
      if (localHour === sunriseHour && !annotations[`sunrise_${dateKey}`]) {
        const exactTime = sunriseLocal.getHours() + sunriseLocal.getMinutes() / 60;
        const offset = exactTime - sunriseHour;
        
        annotations[`sunrise_${dateKey}`] = {
          type: 'line',
          xMin: idx + offset,
          xMax: idx + offset,
          borderColor: 'rgba(251, 191, 36, 0.8)',
          borderWidth: 2,
          borderDash: [5, 5],
          label: {
            display: true,
            content: 'Sunrise',
            position: 'end',
            yAdjust: 10,
            backgroundColor: 'rgba(255, 255, 255, 0.9)',
            color: 'rgba(146, 64, 14, 1)',
            padding: 4,
            borderRadius: 4,
            font: { size: 11, weight: 'bold' }
          }
        };
      }
      
      // Check if this hour matches sunset
      const sunsetLocal = new Date(astro.sunset.toLocaleString('en-US', { timeZone: 'Australia/Hobart' }));
      const sunsetHour = sunsetLocal.getHours();
      
      if (localHour === sunsetHour && !annotations[`sunset_${dateKey}`]) {
        const exactTime = sunsetLocal.getHours() + sunsetLocal.getMinutes() / 60;
        const offset = exactTime - sunsetHour;
        
        annotations[`sunset_${dateKey}`] = {
          type: 'line',
          xMin: idx + offset,
          xMax: idx + offset,
          borderColor: 'rgba(249, 115, 22, 0.8)',
          borderWidth: 2,
          borderDash: [5, 5],
          label: {
            display: true,
            content: 'Sunset',
            position: 'end',
            yAdjust: 10,
            backgroundColor: 'rgba(255, 255, 255, 0.9)',
            color: 'rgba(154, 52, 18, 1)',
            padding: 4,
            borderRadius: 4,
            font: { size: 11, weight: 'bold' }
          }
        };
      }
    }
  });
  
  // Add tide annotations
  if (window.tideData && window.tideData.daily) {
    allHours.forEach((h, idx) => {
      const dateKey = h.date.toLocaleDateString('en-CA');
      const dayTideData = window.tideData.daily.find(d => {
        const tideDate = new Date(d.date_utc);
        return tideDate.toLocaleDateString('en-CA') === dateKey;
      });
      
      if (dayTideData && dayTideData.tide) {
        dayTideData.tide.forEach((tide, tideIdx) => {
          const tideTime = new Date(tide.datetime_utc);
          const tideLocal = new Date(tideTime.toLocaleString('en-US', { timeZone: 'Australia/Hobart' }));
          const tideHour = tideLocal.getHours();
          const localHour = new Date(h.date.toLocaleString('en-US', { timeZone: 'Australia/Hobart' })).getHours();
          
          if (localHour === tideHour && !annotations[`tide_${dateKey}_${tideIdx}`]) {
            const exactTime = tideLocal.getHours() + tideLocal.getMinutes() / 60;
            const offset = exactTime - tideHour;
            
            annotations[`tide_${dateKey}_${tideIdx}`] = {
              type: 'line',
              xMin: idx + offset,
              xMax: idx + offset,
              borderColor: tide.type === 'high' ? 'rgba(59, 130, 246, 0.6)' : 'rgba(147, 197, 253, 0.6)',
              borderWidth: 2,
              borderDash: [3, 3],
              label: {
                display: true,
                content: tide.type === 'high' ? 'High Tide' : 'Low Tide',
                position: 'end',
                yAdjust: 40,
                backgroundColor: 'rgba(255, 255, 255, 0.9)',
                color: tide.type === 'high' ? 'rgba(29, 78, 216, 1)' : 'rgba(37, 99, 235, 1)',
                padding: 4,
                borderRadius: 4,
                font: { size: 11, weight: 'bold' }
              }
            };
          }
        });
      }
    });
  }
  
  // Calculate width to show 24 hours at a time
  const totalHours = allHours.length;
  const widthPercentage = Math.max(100, (totalHours / 24) * 100);
  
  document.querySelector('.chart-inner').style.width = `${widthPercentage}%`;
  
  // Preload icon images with proxy
  const iconImages = [];
  const imagePromises = [];
  
  iconUrls.forEach((url, idx) => {
    if (url) {
      const proxiedUrl = proxy + encodeURIComponent(url);
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = proxiedUrl;
      
      imagePromises.push(
        new Promise((resolve) => {
          img.onload = () => resolve();
          img.onerror = () => resolve();
        })
      );
      
      iconImages.push({
        image: img,
        index: idx
      });
    } else {
      // Placeholder for hours without icons
      iconImages.push({
        image: null,
        index: idx
      });
    }
  });
  
  // Wait for all images to load before creating chart
  Promise.all(imagePromises).then(() => {
  // Create chart
  const ctx = document.getElementById('continuous-chart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Temperature (°C)',
        data: temps,
        backgroundColor: backgroundColors,
        borderColor: borderColors,
        borderWidth: 3,
        fill: true,
        tension: 0.4,
        pointRadius: 4,
        pointHoverRadius: 7,
        pointBackgroundColor: borderColors,
        pointBorderColor: '#fff',
        pointBorderWidth: 2,
        yAxisID: 'y',
        order: 0
      },
      {
        label: 'Feels Like (°C)',
        data: feelsLike,
        backgroundColor: 'transparent',
        borderColor: 'rgba(251, 146, 60, 0.8)',
        borderWidth: 2,
        borderDash: [5, 5],
        fill: false,
        tension: 0.4,
        pointRadius: 2,
        pointHoverRadius: 5,
        pointBackgroundColor: 'rgba(251, 146, 60, 0.8)',
        pointBorderColor: '#fff',
        pointBorderWidth: 1,
        yAxisID: 'y',
        order: 0
      },
      {
        label: 'Rainfall (mm)',
        data: rainfall,
        type: 'bar',
        backgroundColor: 'rgba(59, 130, 246, 0.5)',
        borderColor: 'rgba(59, 130, 246, 0.8)',
        borderWidth: 1,
        yAxisID: 'y1',
        order: 1
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: {
        padding: {
          bottom: 50 // Add space for icons
        }
      },
      plugins: {
        dayIcons: {
          icons: iconImages
        },
        legend: {
          display: false
        },
        annotation: {
          annotations: annotations
        },
        tooltip: {
          backgroundColor: 'rgba(0, 0, 0, 0.8)',
          padding: 12,
          titleFont: { size: 14 },
          bodyFont: { size: 16, weight: 'bold' },
          callbacks: {
            label: function(context) {
              if (context.dataset.label === 'Temperature (°C)') {
                return 'Temp: ' + context.parsed.y + '°C';
              } else if (context.dataset.label === 'Feels Like (°C)') {
                return 'Feels Like: ' + context.parsed.y + '°C';
              } else {
                return 'Rain: ' + context.parsed.y + 'mm';
              }
            }
          }
        }
      },
      scales: {
        y: {
          beginAtZero: false,
          position: 'left',
          grid: {
            color: 'rgba(0, 0, 0, 0.1)'
          },
          ticks: {
            font: { size: 12 },
            callback: function(value) {
              return value + '°';
            }
          },
          title: {
            display: true,
            text: 'Temperature (°C)',
            font: { size: 12, weight: 'bold' }
          }
        },
        y1: {
          beginAtZero: true,
          position: 'right',
          grid: {
            drawOnChartArea: false
          },
          ticks: {
            font: { size: 12 },
            callback: function(value) {
              return value + 'mm';
            }
          },
          title: {
            display: true,
            text: 'Rainfall (mm)',
            font: { size: 12, weight: 'bold' },
            color: 'rgba(59, 130, 246, 1)'
          }
        },
        x: {
          grid: {
            display: true,
            color: 'rgba(0, 0, 0, 0.1)',
            drawOnChartArea: true
          },
          ticks: {
            font: { size: 10 },
            maxRotation: 0,
            autoSkip: false
          }
        }
      }
    }
  });
  }); // Close Promise.all
}

async function loadData() {
  try {
    let hourlyData = null;
    let dailyData = null;
    let obsData = null;
    let astroData = null;
    let tideData = null;
    
    for (const [title, url] of endpoints) {
      const r = await fetch(proxy + encodeURIComponent(url));
      const j = await r.json();
      const data = j.data ?? j;
      
      if (title === "1-Hourly Forecast") {
        hourlyData = data.fcst;
      } else if (title === "Daily Forecast") {
        dailyData = data.fcst?.daily;
      } else if (title === "Latest Observation") {
        obsData = data.obs;
      } else if (title === "Astro") {
        astroData = data.fcst?.daily;
      }
    }
    
    try {
      const tideUrl = 'https://api.bom.gov.au/apikey/v1/forecasts/tidal/TAS_TP003';
      const tideResponse = await fetch(proxy + encodeURIComponent(tideUrl));
      const tideJson = await tideResponse.json();
      tideData = tideJson.fcst || tideJson.data?.fcst || tideJson;
      window.tideData = tideData;
    } catch (e) {
      console.error('Error fetching tide data:', e);
    }
    
    if (obsData && dailyData && astroData) {
      const todayIconCode = dailyData[0]?.atm?.surf_air?.weather?.icon_code;
      renderCurrentObs(obsData, todayIconCode, astroData, dailyData);
    }
    
    if (tideData) {
      renderTideInfo(tideData);
    }
    
    if (hourlyData && dailyData) {
      renderContinuousChart(hourlyData, dailyData, astroData);
    }
    
  } catch (e) {
    console.error('Error loading data:', e);
    document.querySelector('.main-container').innerHTML = '<p style="color: red; padding: 20px;">Error loading weather data</p>';
  }
}

loadData();
</script>
